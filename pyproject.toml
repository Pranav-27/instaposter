[project]
name = "photo-sync"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["boto3>=1.40", "pillow>=11", "pillow-heif>=0.21", "imagehash>=4.3", "numpy"]

[project.optional-dependencies]
dev = ["pytest", "moto[dynamodb,s3]", "aws-cdk-lib>=2.170", "constructs>=10"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["photo_sync*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
